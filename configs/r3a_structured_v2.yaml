# R3A'' structured hard v2：状态边界对照 + 五行依据 completion；干净 Base 冷启动。
stage: R3A-structured-v2-hard
target: operative_status
model: models/qwen3.5-9b-mlx-4bit
data:
  dir: data/r3/staging/r3a_structured_v2
  train_rows: 2864
  valid_rows: 357
adapter:
  output: models/r3a_structured_v2
  fine_tune_type: lora
  num_layers: 2
  rank: 8
  scale: 20
training:
  batch_size: 1
  epochs: 1
  iters: 2864
  learning_rate: 4.0e-06
  max_seq_length: 448
  grad_checkpoint: true
  grad_accumulation_steps: 4
  seed: 42
  save_every: 100
  steps_per_report: 100
  val_batches: 50
  steps_per_eval: 100
  resume_adapter_file: null
gate:
  operative_status_accuracy: 0.90
  superseded_rejection: 0.95
  wrong_authority_preference_rate: 0.03
  critical_t0_t1_miss: 0
  invalid_output: 0
